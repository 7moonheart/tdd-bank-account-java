name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 缓存 Maven 依赖
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 3.5. 在运行 Maven 之前安装 JMeter
      - name: Install JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y jmeter

      # 4. 运行 Maven 构建
      - name: Build with Maven
        run: mvn clean verify

      # 5. 上传 JUnit 测试报告（方便查看）
      - name: Upload JUnit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: target/surefire-reports/

      # 6. 上传 JaCoCo 覆盖率报告
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 7. 上传 Newman API 测试报告（如果有生成）
      - name: Upload Newman test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman/

      # 8. 上传 JMeter 性能测试报告
      - name: Upload JMeter test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: target/jmeter-results/html/

      # 9. 上传打包好的 JAR 文件
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: application-jar
          path: target/*.jar